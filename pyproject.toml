[project]
name = "Advance-Text-to-SQL"
version = "0.0.1"
description = "Advance Text to SQL"
authors = [
    { name = "Ibad ur Rehman", email = "ibadurrehman4077@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "cryptography>=46.0.3",
    "fastapi>=0.127.0",
    "langchain>=1.2.0",
    "langchain-openai>=1.1.6",
    "motor>=3.7.1",
    "pandas>=2.3.3",
    "passlib>=1.7.4",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.5",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.2.1",
    "python-jose>=3.5.0",
    "python-json-logger>=4.0.0",
    "sentry-sdk>=2.48.0",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.1.0",
    "isort>=5.13.2",
    "flake8>=7.1.1",
    "pre-commit>=4.0.1",
    "autoflake>=2.2.0",
    "bandit>=1.7.5",
    "types-python-jose>=3.3.4",
    "types-passlib>=1.7.7",
]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
^/docs|  # exclude docs directory
^/\.cursorrules  # exclude cursorrules file
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
src_paths = ["app"]
skip = ["__init__.py", ".cursorrules"]


[tool.bandit]
exclude_dirs = ["tests", "venv", ".git", "__pycache__"]
targets = ["app"]

[tool.autoflake]
recursive = true
in-place = true
remove-all-unused-imports = true
remove-unused-variables = true
exclude = ["__init__.py", "migrations", ".cursorrules"]
